# Cloudflare Worker of the temporary visit counter. See README.md for the steps.
name = "tracker-watch-counter"
main = "worker.js"
compatibility_date = "2026-10-01"

[vars]
# The origin of the website (no path, no trailing slash): only requests from it are accepted.
ALLOWED_ORIGIN = "https://joseasenjo.github.io"

[[d1_databases]]
binding = "DB"
database_name = "tracker-watch-counter"
# After `wrangler d1 create tracker-watch-counter`, paste the database_id it prints here:
database_id = "REPLACE_WITH_THE_ID_FROM_WRANGLER"
