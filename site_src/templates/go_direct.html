<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="refresh" content="0; url={{ link.url }}">
  <link rel="canonical" href="{{ link.url }}">
  <title>Taking you to {{ link.host }}</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f4f6f9; color: #0f172a; }
    @media (prefers-color-scheme: dark) { body { background: #0b1220; color: #e6ebf3; } a { color: #6ea0ff; } }
    p { margin: 0 16px; text-align: center; overflow-wrap: anywhere; }
    a { color: #1d4ed8; }
  </style>
</head>
<body>
  <p>Taking you to <a href="{{ link.url }}">{{ link.host }}</a>. If nothing happens, use the link.</p>
  <script>window.location.replace({{ link.url|tojson }});</script>
</body>
</html>
