# Temporary: proves that a job using the pinned checkout can still push (the posting jobs record what they posted
# with `git push`). It pushes a throwaway branch and deletes it at once; it never touches main.
name: push-check

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Push a throwaway branch and delete it
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git push origin HEAD:refs/heads/ci-push-check
          git push origin --delete ci-push-check
          echo "push and delete both worked"
