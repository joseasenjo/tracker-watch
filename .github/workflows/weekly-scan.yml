# Weekly scan of the outlet list. Commits the JSON reports (history) and builds the site.
# The site is published to GitHub Pages only when the repository variable PUBLISH_SITE is "true".
# After publishing it can post the weekly thread on Bluesky (job "post", off unless POST_ENABLED is "true").
name: weekly-scan

on:
  # Mondays 07:00 UTC (09:00 in Spain in summer): the scan takes about 40 minutes, so the thread goes out mid-morning.
  # Scheduled runs can start a few minutes late.
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      passes:
        description: "Passes per site"
        default: "3"
      publish:
        description: "false = a test run: everything runs and the drafts are made, but nothing is posted on any network"
        default: "true"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: weekly-scan
  cancel-in-progress: false

env:
  SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
  REPO_URL: https://github.com/${{ github.repository }}

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Tests of the measurement engine (a failure here stops the scan - wrong numbers must not be published)
        run: python -m pytest tests -q -m engine

      - name: All other tests (a failure warns by email but does not stop the scan)
        id: othertests
        continue-on-error: true
        run: python -m pytest tests -q -m "not engine"

      - name: Warn by email that some other tests failed (the scan went on)
        if: ${{ steps.othertests.outcome == 'failure' }}
        env:
          FAILED_WORKFLOW: weekly-scan, some non-engine tests failed but the scan went on
          FAILED_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAILED_EVENT: ${{ github.event_name }}
          MAIL_SMTP_HOST: ${{ secrets.MAIL_SMTP_HOST }}
          MAIL_SMTP_PORT: ${{ vars.MAIL_SMTP_PORT }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          NOTIFY_EMAIL: ${{ vars.NOTIFY_EMAIL || vars.CONTACT_EMAIL }}
        run: python -m traceguard.notify failure

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Scan outlets
        run: >
          python -m traceguard --sites-file data/sites.json
          --passes "${{ github.event.inputs.passes || '3' }}"
          --vantage github-actions-us --out data/runs

      - name: Commit reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python extension/tools/build_data.py   # the extension's data embeds the weekly numbers; a stale copy fails the tests
          git add data/runs extension/data extension/tests/fixtures/parity.json
          git diff --cached --quiet || git commit -m "scan: $(date -u +%F)"
          bash scripts/push_with_retry.sh

      - name: Build site
        run: >
          python -m traceguard.site data/runs --out site --sites-file data/sites.json
          --base-url "$SITE_URL" --subscribe-url "${{ vars.SUBSCRIBE_URL }}" --analytics-url "${{ vars.ANALYTICS_URL }}"
          --repo-url "$REPO_URL" --share-cards
          --contact-email "${{ vars.CONTACT_EMAIL }}" --linkedin-url "${{ vars.LINKEDIN_URL }}"
          --author "${{ vars.AUTHOR_NAME }}" --next-scan "${{ vars.NEXT_SCAN }}"

      - name: Keep the built site for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: site
          retention-days: 14

      - name: Prepare the site for GitHub Pages
        if: ${{ vars.PUBLISH_SITE == 'true' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: scan
    if: ${{ vars.PUBLISH_SITE == 'true' }}
    runs-on: ubuntu-24.04
    concurrency:
      group: pages   # shared with publish-site.yml: only one publication at a time
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Posts the weekly thread on Bluesky, only after the site is live (the thread links to it).
  # Switch: the repository variable POST_ENABLED must be "true"; remove it to stop posting. Secrets needed:
  # BLUESKY_HANDLE and BLUESKY_APP_PASSWORD. A failed step fails the run, and GitHub emails the owner.
  post:
    needs: deploy
    if: ${{ vars.POST_ENABLED == 'true' && vars.PUBLISH_SITE == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main   # includes the reports the scan job just committed

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies and Chromium
        run: |
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium

      - name: Tests of the posting code (a failure here stops the posting - a bug could duplicate or misplace a post)
        run: python -m pytest tests -q -m publishing

      - name: Draft the thread (stops if too few sites were measured well)
        run: >
          python -m traceguard.posts data/runs --platform bluesky --min-measured 0.6
          --report-url "$SITE_URL"

      - name: Draft an alert and a hook post (never published automatically)
        run: |
          python -m traceguard.posts data/runs --platform bluesky --kind alert --report-url "$SITE_URL" || echo "no alert drafted"
          python -m traceguard.posts data/runs --platform bluesky --kind hook --report-url "$SITE_URL" || echo "no hook drafted"

      - name: Draft the same posts for Mastodon (same limit as Bluesky; alerts and hooks are never published automatically)
        continue-on-error: true
        run: |
          python -m traceguard.posts data/runs --platform mastodon --max-chars 300 --min-measured 0.6 --report-url "$SITE_URL" || echo "no mastodon thread drafted"
          python -m traceguard.posts data/runs --platform mastodon --max-chars 300 --kind alert --report-url "$SITE_URL" || echo "no mastodon alert drafted"
          python -m traceguard.posts data/runs --platform mastodon --max-chars 300 --kind hook --report-url "$SITE_URL" || echo "no mastodon hook drafted"

      - name: Waiting for your approval (review mode is on)
        if: ${{ (vars.POST_REVIEW == 'true' || github.event.inputs.publish == 'false') }}
        run: |
          echo "Draft ready, NOT published. Approve it in the developer dashboard or run publish-draft." >> "$GITHUB_STEP_SUMMARY"

      - name: Email that nothing was published (review mode is on)
        if: ${{ (vars.POST_REVIEW == 'true' || github.event.inputs.publish == 'false') }}
        env:
          NOT_PUBLISHED_PLATFORM: bluesky,mastodon
          NOT_PUBLISHED_REASON: "review mode is on (POST_REVIEW) or this is a test run (publish=false): the draft waits for your approval in the dashboard"
          NOT_PUBLISHED_WORKFLOW: ${{ github.workflow }}
          NOT_PUBLISHED_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MAIL_SMTP_HOST: ${{ secrets.MAIL_SMTP_HOST }}
          MAIL_SMTP_PORT: ${{ vars.MAIL_SMTP_PORT }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          NOTIFY_EMAIL: ${{ vars.NOTIFY_EMAIL || vars.CONTACT_EMAIL }}
        run: python -m traceguard.notify not-published

      - name: Publish on Bluesky
        if: ${{ vars.POST_REVIEW != 'true' && github.event.inputs.publish != 'false' }}
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          MAIL_SMTP_HOST: ${{ secrets.MAIL_SMTP_HOST }}
          MAIL_SMTP_PORT: ${{ vars.MAIL_SMTP_PORT }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          NOTIFY_EMAIL: ${{ vars.NOTIFY_EMAIL || vars.CONTACT_EMAIL }}
        run: python -m traceguard.publish "data/drafts/$(ls data/drafts | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' | sort | tail -1)" --platform bluesky --send

      - name: Publish on Mastodon (same text as Bluesky, only if MASTODON_ENABLED is "true")
        id: mastodon
        if: ${{ vars.POST_REVIEW != 'true' && github.event.inputs.publish != 'false' && vars.MASTODON_ENABLED == 'true' }}
        continue-on-error: true   # a Mastodon problem never undoes or fails the Bluesky publication (the step after the digest emails it)
        env:
          MASTODON_URL: ${{ vars.MASTODON_URL }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          MAIL_SMTP_HOST: ${{ secrets.MAIL_SMTP_HOST }}
          MAIL_SMTP_PORT: ${{ vars.MAIL_SMTP_PORT }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          NOTIFY_EMAIL: ${{ vars.NOTIFY_EMAIL || vars.CONTACT_EMAIL }}
        run: python -m traceguard.publish "data/drafts/$(ls data/drafts | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' | sort | tail -1)" --platform mastodon --send --skip-if-published

      - name: Publish the alert and the hook post on their own (only if ALERTS_AUTO is "true"; otherwise they wait for your approval)
        id: alerts
        if: ${{ vars.POST_REVIEW != 'true' && github.event.inputs.publish != 'false' && vars.ALERTS_AUTO == 'true' }}
        continue-on-error: true   # an alert problem never undoes or fails the weekly thread (the warning step below emails it)
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          MASTODON_ENABLED: ${{ vars.MASTODON_ENABLED }}
          MASTODON_URL: ${{ vars.MASTODON_URL }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          MAIL_SMTP_HOST: ${{ secrets.MAIL_SMTP_HOST }}
          MAIL_SMTP_PORT: ${{ vars.MAIL_SMTP_PORT }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          NOTIFY_EMAIL: ${{ vars.NOTIFY_EMAIL || vars.CONTACT_EMAIL }}
        run: |
          base="$(ls data/drafts | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' | sort | tail -1)"
          failed=0
          for kind in alert hook; do
            folder="data/drafts/${base}-${kind}"
            if [ ! -d "$folder" ]; then echo "no $kind post this week"; continue; fi
            python -m traceguard.publish "$folder" --platform bluesky --send --skip-if-published || failed=1
            if [ "$MASTODON_ENABLED" = "true" ]; then
              python -m traceguard.publish "$folder" --platform mastodon --send --skip-if-published || failed=1
            fi
          done
          exit $failed

      - name: Email that Mastodon was not published (switched off)
        if: ${{ vars.POST_REVIEW != 'true' && github.event.inputs.publish != 'false' && vars.MASTODON_ENABLED != 'true' }}
        env:
          NOT_PUBLISHED_PLATFORM: mastodon
          NOT_PUBLISHED_REASON: "Mastodon publishing is switched off (MASTODON_ENABLED is not true)"
          NOT_PUBLISHED_WORKFLOW: ${{ github.workflow }}
          NOT_PUBLISHED_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MAIL_SMTP_HOST: ${{ secrets.MAIL_SMTP_HOST }}
          MAIL_SMTP_PORT: ${{ vars.MAIL_SMTP_PORT }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          NOTIFY_EMAIL: ${{ vars.NOTIFY_EMAIL || vars.CONTACT_EMAIL }}
        run: python -m traceguard.notify not-published

      - name: Email the digest automatically (only if DIGEST_ENABLED and DIGEST_AUTO are "true"; otherwise it waits for your approval)
        id: digest
        if: ${{ vars.POST_REVIEW != 'true' && github.event.inputs.publish != 'false' && vars.DIGEST_ENABLED == 'true' && vars.DIGEST_AUTO == 'true' }}
        continue-on-error: true   # an email problem never undoes or fails a publication
        env:
          SUBSCRIBERS_JSON: ${{ secrets.SUBSCRIBERS_JSON }}
          MAIL_SMTP_HOST: ${{ secrets.MAIL_SMTP_HOST }}
          MAIL_SMTP_PORT: ${{ vars.MAIL_SMTP_PORT }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          DIGEST_MAIL_USER: ${{ secrets.DIGEST_MAIL_USER }}
          DIGEST_MAIL_PASSWORD: ${{ secrets.DIGEST_MAIL_PASSWORD }}
          DIGEST_SENDER: ${{ vars.DIGEST_SENDER }}
          DIGEST_KINDS: ${{ vars.DIGEST_KINDS }}
          DIGEST_SIGNATURE: ${{ vars.DIGEST_SIGNATURE }}
          DIGEST_CTA: ${{ vars.DIGEST_CTA }}
          DIGEST_ENABLED: ${{ vars.DIGEST_ENABLED }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
        run: python -m traceguard.digest "data/drafts/$(ls data/drafts | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' | sort | tail -1)" --send

      - name: Warn by email about a step that failed without stopping the run (Mastodon or the digest)
        if: ${{ always() && (steps.mastodon.outcome == 'failure' || steps.digest.outcome == 'failure' || steps.alerts.outcome == 'failure') }}
        env:
          FAILED_WORKFLOW: weekly-scan, ${{ steps.mastodon.outcome == 'failure' && 'Mastodon step' || '' }} ${{ steps.digest.outcome == 'failure' && 'digest step' || '' }} ${{ steps.alerts.outcome == 'failure' && 'alert/hook step' || '' }}
          FAILED_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAILED_EVENT: ${{ github.event_name }}
          MAIL_SMTP_HOST: ${{ secrets.MAIL_SMTP_HOST }}
          MAIL_SMTP_PORT: ${{ vars.MAIL_SMTP_PORT }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          NOTIFY_EMAIL: ${{ vars.NOTIFY_EMAIL || vars.CONTACT_EMAIL }}
        run: python -m traceguard.notify failure

      - name: Record what was posted (so a re-run never repeats it)
        if: ${{ always() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/drafts
          git diff --cached --quiet || git commit -m "posts: $(date -u +%F)"
          bash scripts/push_with_retry.sh

  post-off:
    # When posting is switched off (POST_ENABLED or PUBLISH_SITE), say so by email: silence must never mean "it worked".
    needs: scan
    if: ${{ always() && needs.scan.result == 'success' && !(vars.POST_ENABLED == 'true' && vars.PUBLISH_SITE == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Email that nothing was published (posting is switched off)
        env:
          NOT_PUBLISHED_PLATFORM: bluesky,mastodon
          NOT_PUBLISHED_REASON: "posting is switched off (POST_ENABLED or PUBLISH_SITE is not true), so the job that posts did not run"
          NOT_PUBLISHED_WORKFLOW: ${{ github.workflow }}
          NOT_PUBLISHED_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MAIL_SMTP_HOST: ${{ secrets.MAIL_SMTP_HOST }}
          MAIL_SMTP_PORT: ${{ vars.MAIL_SMTP_PORT }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          NOTIFY_EMAIL: ${{ vars.NOTIFY_EMAIL || vars.CONTACT_EMAIL }}
        run: python -m traceguard.notify not-published
