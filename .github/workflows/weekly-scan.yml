# Weekly scan of the outlet list. Commits the JSON reports (history) and builds the site.
# The site is published to GitHub Pages only when the repository variable PUBLISH_SITE is "true".
# It never posts to Bluesky or Mastodon.
name: weekly-scan

on:
  # Schedule stays disabled until the owner decides to turn it on.
  # schedule:
  #   - cron: "0 5 * * 1"   # Mondays 05:00 UTC; scheduled runs can start a few minutes late
  workflow_dispatch:
    inputs:
      passes:
        description: "Passes per site"
        default: "3"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: weekly-scan
  cancel-in-progress: false

env:
  SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
  REPO_URL: https://github.com/${{ github.repository }}

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Unit tests
        run: python -m pytest tests -q

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Scan outlets
        run: >
          python -m traceguard --sites-file data/sites.json
          --passes "${{ github.event.inputs.passes || '3' }}"
          --vantage github-actions-us --out data/runs

      - name: Commit reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/runs
          git diff --cached --quiet || git commit -m "scan: $(date -u +%F)"
          git pull --rebase --autostash   # the link workflow may have pushed meanwhile
          git push

      - name: Build site
        run: >
          python -m traceguard.site data/runs --out site --sites-file data/sites.json
          --base-url "$SITE_URL" --subscribe-url "${{ vars.SUBSCRIBE_URL }}"
          --repo-url "$REPO_URL" --share-cards
          --contact-email "${{ vars.CONTACT_EMAIL }}" --linkedin-url "${{ vars.LINKEDIN_URL }}"
          --author "${{ vars.AUTHOR_NAME }}" --next-scan "${{ vars.NEXT_SCAN }}"

      - name: Keep the built site for review
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site
          retention-days: 14

      - name: Prepare the site for GitHub Pages
        if: ${{ vars.PUBLISH_SITE == 'true' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: scan
    if: ${{ vars.PUBLISH_SITE == 'true' }}
    runs-on: ubuntu-latest
    concurrency:
      group: pages   # shared with publish-site.yml: only one publication at a time
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
