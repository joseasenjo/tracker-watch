# Public requests, with no manual approval: someone opens an issue with one of the two forms and this workflow
# answers it. The limits (per GitHub account, daily cap, minimum account age, blocked accounts, on/off switch)
# live in data/limits.json and are edited from the local dashboard (python -m traceguard.admin).
#  - scan-request: analyse one address, reply in the issue, close it. The result is not added to the ranking.
#  - link-request: check the address, measure it, add it to data/links.json, republish the site, reply, close.
# Issue text is never pasted into a shell command: it reaches the scripts through environment variables and files.
name: requests

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  REPO: ${{ github.repository }}
  ISSUE_NUMBER: ${{ github.event.issue.number }}
  AUTHOR: ${{ github.event.issue.user.login }}
  ISSUE_CREATED: ${{ github.event.issue.created_at }}
  ISSUE_BODY: ${{ github.event.issue.body }}
  SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

jobs:
  scan:
    if: ${{ contains(github.event.issue.labels.*.name, 'scan-request') || startsWith(github.event.issue.title, '[Scan]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies and Chromium
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Label the issue and collect the account's history
        run: |
          gh label create scan-request --force --color 0e8a16 --description "Address analysis request" || true
          gh issue edit "$ISSUE_NUMBER" --add-label scan-request || true
          printf '%s' "$ISSUE_BODY" > body.txt
          gh api "users/$AUTHOR" --jq .created_at > created.txt
          gh issue list --repo "$REPO" --label scan-request --state all --limit 300 \
            --json number,author,createdAt \
            --jq '[.[] | {number, author: .author.login, created_at: .createdAt}]' > history-all.json
          jq --argjson n "$ISSUE_NUMBER" --arg a "$AUTHOR" --arg c "$ISSUE_CREATED" \
            'if any(.[]; .number == $n) then . else . + [{number: $n, author: $a, created_at: $c}] end' \
            history-all.json > history.json

      - name: Analyse
        run: >
          python -m traceguard.ondemand --body-file body.txt --author "$AUTHOR"
          --account-created "$(cat created.txt)" --history-file history.json --limits data/limits.json
          --out comment.md --result-file result.json

      - name: Reply and close
        run: |
          gh issue comment "$ISSUE_NUMBER" --body-file comment.md
          gh issue close "$ISSUE_NUMBER" --reason completed

      - name: Reply if something went wrong
        if: ${{ failure() }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "Something went wrong while analysing that address. Nothing was added to the site. You can try again later."
          gh issue close "$ISSUE_NUMBER" --reason "not planned" || true

  link:
    if: ${{ contains(github.event.issue.labels.*.name, 'link-request') || startsWith(github.event.issue.title, '[Link]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      actions: write
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies and Chromium
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Label the issue and collect the account's history
        run: |
          gh label create link-request --force --color 1d76db --description "Short link request" || true
          gh issue edit "$ISSUE_NUMBER" --add-label link-request || true
          printf '%s' "$ISSUE_BODY" > "$RUNNER_TEMP/body.txt"
          gh api "users/$AUTHOR" --jq .created_at > "$RUNNER_TEMP/created.txt"
          gh issue list --repo "$REPO" --label link-request --state all --limit 300 \
            --json number,author,createdAt \
            --jq '[.[] | {number, author: .author.login, created_at: .createdAt}]' > "$RUNNER_TEMP/history-all.json"
          jq --argjson n "$ISSUE_NUMBER" --arg a "$AUTHOR" --arg c "$ISSUE_CREATED" \
            'if any(.[]; .number == $n) then . else . + [{number: $n, author: $a, created_at: $c}] end' \
            "$RUNNER_TEMP/history-all.json" > "$RUNNER_TEMP/history.json"

      - name: Check, measure, add and push (retries if another run pushed first)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pushed=false
          created=false
          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin "$DEFAULT_BRANCH"
            git reset --quiet --hard "origin/$DEFAULT_BRANCH"
            python -m traceguard.links request --body-file "$RUNNER_TEMP/body.txt" --author "$AUTHOR" \
              --account-created "$(cat "$RUNNER_TEMP/created.txt")" --history-file "$RUNNER_TEMP/history.json" \
              --limits data/limits.json --site-url "$SITE_URL" \
              --out "$RUNNER_TEMP/comment.md" --result-file "$RUNNER_TEMP/result.json"
            created=$(jq -r .created "$RUNNER_TEMP/result.json")
            if [ "$created" != "true" ]; then break; fi
            code=$(jq -r .code "$RUNNER_TEMP/result.json")
            git add data/links.json
            git commit --quiet -m "link: $code"
            if git push --quiet origin "HEAD:$DEFAULT_BRANCH"; then pushed=true; break; fi
            sleep $((RANDOM % 6 + 2))
          done
          echo "created=$created" >> "$GITHUB_ENV"
          echo "pushed=$pushed" >> "$GITHUB_ENV"

      - name: Republish the site
        if: ${{ env.created == 'true' && env.pushed == 'true' }}
        run: gh workflow run publish-site.yml --repo "$REPO" || echo "the site will update with the next publication"

      - name: Reply and close
        run: |
          if [ "$created" = "true" ] && [ "$pushed" != "true" ]; then
            echo "This request could not be saved because of a conflict. Please try again in a few minutes." > "$RUNNER_TEMP/comment.md"
          fi
          gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/comment.md"
          gh issue close "$ISSUE_NUMBER" --reason completed

      - name: Reply if something went wrong
        if: ${{ failure() }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "Something went wrong while creating that link. Nothing was added. You can try again later."
          gh issue close "$ISSUE_NUMBER" --reason "not planned" || true
