# Posts one short mid-week post on Bluesky from the latest measurement (no new scan): which companies' tracking
# services reach the most sites. Wednesdays 08:00 UTC. Off unless the repository variable POST_ENABLED is "true";
# needs the secrets BLUESKY_HANDLE and BLUESKY_APP_PASSWORD. A failed step fails the run, and GitHub emails the owner.
# A draft that was already published (no new scan since the last post) is skipped, not reported as a failure.
name: post-midweek

on:
  schedule:
    - cron: "0 8 * * 3"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-scan   # never at the same time as a scan that is committing reports
  cancel-in-progress: false

env:
  SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

jobs:
  post:
    if: ${{ vars.POST_ENABLED == 'true' && vars.PUBLISH_SITE == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Draft the post
        run: python -m traceguard.posts data/runs --platform bluesky --kind midweek --report-url "$SITE_URL"

      - name: Waiting for your approval (review mode is on)
        if: ${{ vars.POST_REVIEW == 'true' }}
        run: |
          echo "Draft ready, NOT published. Approve it in the developer dashboard or run publish-draft." >> "$GITHUB_STEP_SUMMARY"

      - name: Publish on Bluesky
        if: ${{ vars.POST_REVIEW != 'true' }}
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          MAIL_SMTP_HOST: ${{ secrets.MAIL_SMTP_HOST }}
          MAIL_SMTP_PORT: ${{ vars.MAIL_SMTP_PORT }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          NOTIFY_EMAIL: ${{ vars.NOTIFY_EMAIL || vars.CONTACT_EMAIL }}
        run: python -m traceguard.publish "data/drafts/$(ls data/drafts | grep -- '-midweek$' | sort | tail -1)" --platform bluesky --send --skip-if-published

      - name: Email the digest to the subscribers (off unless DIGEST_ENABLED is "true")
        if: ${{ vars.POST_REVIEW != 'true' && vars.DIGEST_ENABLED == 'true' }}
        continue-on-error: true   # an email problem never undoes or fails a publication
        env:
          SUBSCRIBERS_JSON: ${{ secrets.SUBSCRIBERS_JSON }}
          MAIL_SMTP_HOST: ${{ secrets.MAIL_SMTP_HOST }}
          MAIL_SMTP_PORT: ${{ vars.MAIL_SMTP_PORT }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          DIGEST_MAIL_USER: ${{ secrets.DIGEST_MAIL_USER }}
          DIGEST_MAIL_PASSWORD: ${{ secrets.DIGEST_MAIL_PASSWORD }}
          DIGEST_SENDER: ${{ vars.DIGEST_SENDER }}
          DIGEST_KINDS: ${{ vars.DIGEST_KINDS }}
          DIGEST_SIGNATURE: ${{ vars.DIGEST_SIGNATURE }}
          DIGEST_ENABLED: ${{ vars.DIGEST_ENABLED }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
        run: python -m traceguard.digest "data/drafts/$(ls data/drafts | grep -- '-midweek$' | sort | tail -1)" --send

      - name: Record what was posted (so a re-run never repeats it)
        if: ${{ always() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/drafts
          git diff --cached --quiet || git commit -m "posts: midweek $(date -u +%F)"
          git pull --rebase --autostash
          git push
