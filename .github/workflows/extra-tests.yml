# The two separate tests: on demand, and the blocking-list test also once a month (the first Tuesday, 06:00 UTC, the day
# after the weekly scan so the two can be paired), which keeps the
# "how many tracking services does a blocking list stop" figures of the protection page fresh. The monthly run measures
# only the blocking-list test and republishes the site afterwards. The two separate tests, run on demand. They never touch data/runs (the weekly ranking) and never publish:
# the next site build picks up data/consent and data/protected.
#  - consent: press the consent banner's reject / accept button once (from US servers few banners appear;
#    the same command can be run from a PC in the EU with --vantage local-windows-spain)
#  - blocklist: block what EasyPrivacy targets (domain rules only); the list is downloaded here, not stored
name: extra-tests

on:
  schedule:
    - cron: "0 6 * * 2"   # every Tuesday; the gate step below lets only the first one of the month through
  workflow_dispatch:
    inputs:
      test:
        description: "Which test"
        type: choice
        options: [consent, blocklist, both]
        default: both
      passes:
        description: "Passes per site (per button for the consent test)"
        default: "2"

permissions:
  contents: write
  actions: write   # to start publish-site after the monthly run

concurrency:
  group: weekly-scan   # never at the same time as the weekly scan (both commit to the repository)
  cancel-in-progress: false

env:
  VANTAGE: github-actions-us
  EASYPRIVACY_URL: https://easylist.to/easylist/easyprivacy.txt

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Decide whether to run (a scheduled run goes ahead only on the first Tuesday of the month)
        id: gate
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "schedule" ] || [ "$(date -u +%-d)" -le 7 ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "go=false" >> "$GITHUB_OUTPUT"; echo "not the first Tuesday: nothing to do"; fi

      - name: Install dependencies
        if: ${{ steps.gate.outputs.go == 'true' }}
        run: pip install -r requirements-dev.txt

      - name: Tests of the measurement engine (a failure here stops the run)
        if: ${{ steps.gate.outputs.go == 'true' }}
        run: python -m pytest tests -q -m engine

      - name: Install Chromium
        if: ${{ steps.gate.outputs.go == 'true' }}
        run: python -m playwright install --with-deps chromium

      - name: Consent test
        if: ${{ steps.gate.outputs.go == 'true' && (github.event.inputs.test != 'blocklist' && github.event_name != 'schedule') }}
        run: >
          python -m traceguard --sites-file data/sites.json --consent reject,accept
          --passes "${{ github.event.inputs.passes || '2' }}" --vantage "$VANTAGE"
          || echo "some sites could not be measured"

      - name: Blocking-list test
        if: ${{ steps.gate.outputs.go == 'true' && (github.event.inputs.test != 'consent') }}
        run: |
          curl -sSfL "$EASYPRIVACY_URL" -o "$RUNNER_TEMP/easyprivacy.txt"
          python -m traceguard --sites-file data/sites.json --blocklist "$RUNNER_TEMP/easyprivacy.txt" \
            --blocklist-name EasyPrivacy --blocklist-url "$EASYPRIVACY_URL" \
            --passes "${{ github.event.inputs.passes || '2' }}" --vantage "$VANTAGE" \
            || echo "some sites could not be measured"

      - name: Commit reports
        if: ${{ steps.gate.outputs.go == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p data/consent data/protected
          git add data/consent data/protected
          git diff --cached --quiet || git commit -m "extra tests: $(date -u +%F)"
          git pull --rebase --autostash
          git push

      - name: Publish the site again after a monthly run (so the protection page shows the new figures)
        if: ${{ steps.gate.outputs.go == 'true' && (github.event_name == 'schedule') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish-site.yml
