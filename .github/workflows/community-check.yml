# Validates community-contributed origins in pull requests (shape, size, known sites, no query strings,
# no cookie values). It runs no scanner and never executes anything from the contributed files.
name: community-check

on:
  pull_request:
    paths:
      - "data/community/**"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m traceguard.community check data/community --sites-file data/sites.json
