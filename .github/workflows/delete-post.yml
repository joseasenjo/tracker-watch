# Deletes ONE post of the account, started by hand and only on the maintainer's explicit request (for example to remove
# a duplicate). It refuses unless the post text starts with the text given in "expect". Needs the secrets
# BLUESKY_HANDLE and BLUESKY_APP_PASSWORD. It changes nothing in the repository.
name: delete-post

on:
  workflow_dispatch:
    inputs:
      rkey:
        description: "Post key: the last part of the post address (13 letters and digits)"
        required: true
      expect:
        description: "How the post text starts (safety check)"
        required: true

permissions:
  contents: read

jobs:
  delete:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Delete the post
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          RKEY: ${{ github.event.inputs.rkey }}
          EXPECT: ${{ github.event.inputs.expect }}
        run: python -m traceguard.bsky_delete "$RKEY" --expect "$EXPECT"
