# Publishes a draft that is waiting for approval (review mode: repository variable POST_REVIEW = "true").
# Started by hand or from the developer dashboard (python -m traceguard.admin, page /ops). Needs the secrets
# BLUESKY_HANDLE and BLUESKY_APP_PASSWORD. A draft that was already published is never sent twice (the .posted.json
# record), and one older than 14 days is refused.
name: publish-draft

on:
  workflow_dispatch:
    inputs:
      folder:
        description: "Draft folder, e.g. data/drafts/2026-10-12 or data/drafts/2026-10-14-midweek"
        required: true
      platform:
        description: "Where to publish (the draft file <platform>.json must exist in the folder)"
        type: choice
        options: [bluesky, mastodon, both]
        default: bluesky

permissions:
  contents: write

concurrency:
  group: weekly-scan   # never at the same time as a scan that is committing reports
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check the folder name
        env:
          FOLDER: ${{ github.event.inputs.folder }}
        run: |
          echo "$FOLDER" | grep -Eq '^data/drafts/[0-9]{4}-[0-9]{2}-[0-9]{2}(-midweek|-alert|-hook|-announce|-monthly)?$' || { echo "bad folder name"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Publish
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          MASTODON_URL: ${{ vars.MASTODON_URL }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          PLATFORM: ${{ github.event.inputs.platform || 'bluesky' }}
          MAIL_SMTP_HOST: ${{ secrets.MAIL_SMTP_HOST }}
          MAIL_SMTP_PORT: ${{ vars.MAIL_SMTP_PORT }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          NOTIFY_EMAIL: ${{ vars.NOTIFY_EMAIL || vars.CONTACT_EMAIL }}
          FOLDER: ${{ github.event.inputs.folder }}
        run: python -m traceguard.publish "$FOLDER" --platform "$PLATFORM" --send

      - name: Email the digest automatically (only if DIGEST_ENABLED and DIGEST_AUTO are "true"; only the kinds in DIGEST_KINDS)
        if: ${{ vars.DIGEST_ENABLED == 'true' && vars.DIGEST_AUTO == 'true' && github.event.inputs.platform != 'mastodon' }}
        continue-on-error: true   # an email problem never undoes or fails a publication
        env:
          SUBSCRIBERS_JSON: ${{ secrets.SUBSCRIBERS_JSON }}
          MAIL_SMTP_HOST: ${{ secrets.MAIL_SMTP_HOST }}
          MAIL_SMTP_PORT: ${{ vars.MAIL_SMTP_PORT }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          DIGEST_MAIL_USER: ${{ secrets.DIGEST_MAIL_USER }}
          DIGEST_MAIL_PASSWORD: ${{ secrets.DIGEST_MAIL_PASSWORD }}
          DIGEST_SENDER: ${{ vars.DIGEST_SENDER }}
          DIGEST_KINDS: ${{ vars.DIGEST_KINDS }}
          DIGEST_SIGNATURE: ${{ vars.DIGEST_SIGNATURE }}
          DIGEST_CTA: ${{ vars.DIGEST_CTA }}
          DIGEST_ENABLED: ${{ vars.DIGEST_ENABLED }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          FOLDER: ${{ github.event.inputs.folder }}
        run: python -m traceguard.digest "$FOLDER" --send

      - name: Record what was posted (so a re-run never repeats it)
        if: ${{ always() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/drafts
          git diff --cached --quiet || git commit -m "posts: approved draft"
          git pull --rebase --autostash
          git push
