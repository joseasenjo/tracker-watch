# Creates (once) the Bluesky list "News outlets measured by Tracker Watch" and adds the outlets in data/bsky_accounts.json
# that are missing from it. Started by hand. It never removes anything. Needs the secrets BLUESKY_HANDLE and
# BLUESKY_APP_PASSWORD. "dry_run" shows what would happen and changes nothing.
name: bluesky-list

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = only show what would be done"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create or update the list
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then python -m traceguard.bsky_list sync --dry-run; else python -m traceguard.bsky_list sync; fi
