# Rebuilds the site from the data already in the repository and publishes it to GitHub Pages, without scanning.
# Started by the link workflow after a new short link is added, or by hand. Publishes only when the repository
# variable PUBLISH_SITE is "true", like the weekly workflow.
name: publish-site

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
  REPO_URL: https://github.com/${{ github.repository }}

jobs:
  publish:
    if: ${{ vars.PUBLISH_SITE == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies and Chromium
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Build site
        run: >
          python -m traceguard.site data/runs --out site --sites-file data/sites.json
          --base-url "$SITE_URL" --subscribe-url "${{ vars.SUBSCRIBE_URL }}" --analytics-url "${{ vars.ANALYTICS_URL }}"
          --repo-url "$REPO_URL" --share-cards
          --contact-email "${{ vars.CONTACT_EMAIL }}" --linkedin-url "${{ vars.LINKEDIN_URL }}"
          --author "${{ vars.AUTHOR_NAME }}" --next-scan "${{ vars.NEXT_SCAN }}"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
