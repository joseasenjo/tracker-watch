name: Request a short link
description: Ask for a short link that shows where it leads before the visitor continues.
title: "[Link] "
labels: ["link-request"]
body:
  - type: markdown
    attributes:
      value: "Issues are public. Every link is reviewed by hand and only added if it follows the rules on the Short links page."
  - type: input
    id: target
    attributes:
      label: Target address
      placeholder: "https://www.example.com/page"
    validations:
      required: true
  - type: input
    id: code
    attributes:
      label: Preferred short code
      description: "3-32 characters: lowercase letters, digits and hyphens. Optional."
  - type: textarea
    id: reason
    attributes:
      label: Why do you need it?
